<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact information</title>

    <style>

        body{
            background-color: #0F172A;
        }

        .parent{
            height: 300px;
            width: 400px;
            margin: auto;
            border: 1px solid #A78BFA;
            display: flex;
            justify-content: center;
            align-items: center;
        
        }

        .child{
            border: 3px solid #A78BFA;
            height: 200px;
            width: 300px;
        }

        .P{
            margin-left: 15px;
            margin-right: 15px;
            color: #94A3B8;
            
        }

        .h1{
            padding-left: 5px;
            border-left: 5px solid#ff3131;
            color:#E2E8F0 ;
            font-weight: bold;
            font-family: monospace;
             margin-left: 15px;
             margin-right: 25px;
        }


        .go-backdiv{
            display: flex;
            justify-content: center;
        }


        .go-back{
          color: #94A3B8 ; 
          cursor: pointer;
          transition-property: color;
          transition: linear;
          transition: 1s;
        }

        .go-back:hover{
            color: #A78BFA;
            
        }


    </style>

</head>
<body>
        <div class="parent">
            <div class="child">
                <p class="P">
                    if you are intrested in my web developing skills
                </p>
                <p class="P">
                    contact me on discord
                </p>
                <h1  class="h1">
                    gauraang1772
                </h1>
            </div>
        </div>
            
        <div  class="go-backdiv">

        <p onclick="index()"  class="go-back">
            Go back
        </p>


        
 </div>

<script>
   function index(){
       window.location.href="index.html"
</script>
    
</body>
</html>
